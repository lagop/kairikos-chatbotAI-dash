# =============================================================================
# Kairikos — Docker Compose for the end-client portal
#
# This compose references a PRE-BUILT image at ghcr.io, so the Hostinger
# Docker Manager (which only fetches a single file) can deploy it without
# needing access to the Dockerfile, package.json, or Prisma schema.
#
# The image is built and pushed by .github/workflows/build-image.yml on
# every push to main that touches portal/**. Latest tag is always:
#   ghcr.io/lagop/kairikos-chatbotai-dash/portal-app:latest
#
# Deploy modes (selected by DEPLOY_MODE env var):
#
#   DEPLOY_MODE=dev-ip-port   (default for now)
#     - App exposed directly on a host port (default 3001, override with APP_PORT)
#     - No nginx, no certbot, no DNS needed
#     - Access the portal at http://<VPS_IP>:3001
#     - Use this when kairikos.com is hosted elsewhere and you just need to
#       see the portal working end-to-end on the VPS.
#
#   DEPLOY_MODE=prod-dns-tls
#     - Full stack: nginx reverse proxy + certbot auto-renewal on 80/443
#     - Requires portal.kairikos.cloud DNS pointing at the VPS
#     - Use this for production. Run certbot once after first deploy to
#       bootstrap the TLS cert.
# =============================================================================

services:
  app:
    image: ghcr.io/lagop/kairikos-chatbotai-dash/portal-app:latest
    # Without this, `docker compose up -d` only recreates a container
    # whose CONFIG changed — an unchanged `:latest` tag string is not a
    # config change, so a plain redeploy silently kept running the OLD
    # image underneath the same tag all session, needing a manual
    # `docker pull` + `--force-recreate` every single time. This makes
    # every `docker compose up -d` (including whatever Hostinger's own
    # deploy action runs) always pull first and recreate if the digest
    # actually changed.
    pull_policy: always
    container_name: kairikos-portal-app
    restart: unless-stopped
    # dev-ip-port mode: expose the app directly on APP_PORT (default 3001).
    # prod-dns-tls mode: nginx proxies to app:3000 internally, so the app
    # only needs to be reachable on the internal Docker network.
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      # Sin valor por defecto a propósito, igual que DATABASE_URL: prisma
      # migrate deploy se ejecuta DENTRO de este contenedor y el esquema
      # declara directUrl = env("DIRECT_URL"). Vacía, la validación del
      # esquema falla antes de tocar la base de datos. En esta VPS no hay
      # pooler, así que su valor es el mismo que DATABASE_URL.
      DIRECT_URL: ${DIRECT_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Kairikos Portal <contacto@kairikos.com>}
      AUTH_SUPPORT_EMAIL: ${AUTH_SUPPORT_EMAIL:-contacto@kairikos.com}
      AUTH_SUPPORT_WHATSAPP: ${AUTH_SUPPORT_WHATSAPP:-https://wa.me/34624514425}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # NEXTAUTH_URL must match how the user reaches the portal:
      #   dev mode:  http://<VPS_IP>:3001
      #   prod mode: https://portal.kairikos.cloud
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PORTAL_API_KEY: ${PORTAL_API_KEY}

      # --- Required for Canales (chatbot channel activation), the cron
      # routes, operator 2FA, and the QA/operator-key bypass. Without
      # these, the app still boots, but those features are dead — see
      # .env.production.example for how to generate each one.
      CHANNEL_CREDENTIAL_ENCRYPTION_KEY: ${CHANNEL_CREDENTIAL_ENCRYPTION_KEY}
      OPERATOR_TOTP_ENCRYPTION_KEY: ${OPERATOR_TOTP_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      KAIA_OPERATOR_API_KEY: ${KAIA_OPERATOR_API_KEY}
      N8N_CHANNEL_WEBHOOK_URL: ${N8N_CHANNEL_WEBHOOK_URL}
      N8N_CHANNEL_WEBHOOK_SECRET: ${N8N_CHANNEL_WEBHOOK_SECRET}
      N8N_TELEGRAM_WEBHOOK_BASE_URL: ${N8N_TELEGRAM_WEBHOOK_BASE_URL}
      N8N_WEBCHAT_URL: ${N8N_WEBCHAT_URL}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_CONFIG_ID: ${META_CONFIG_ID}

      # --- Optional — leave blank until you activate the matching
      # product. The app degrades gracefully (feature just shows as
      # "not configured") when any of these are unset; nothing below
      # this line blocks the first deploy. See .env.production.example
      # for what each group turns on.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_BUSINESS_OAUTH_CLIENT_ID: ${GOOGLE_BUSINESS_OAUTH_CLIENT_ID:-}
      GOOGLE_BUSINESS_OAUTH_CLIENT_SECRET: ${GOOGLE_BUSINESS_OAUTH_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_OAUTH_REDIRECT_URI: ${GOOGLE_BUSINESS_OAUTH_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      # 'seo' — same pre-UI-fallback relationship to
      # /admin/portal/settings/integrations as the Google Business vars
      # above. Never wired through here before — same class of gap as
      # GOOGLE_PLACES_API_KEY (declared in code, never passed through
      # Compose), caught alongside it while building the settings UI.
      GOOGLE_SEO_OAUTH_CLIENT_ID: ${GOOGLE_SEO_OAUTH_CLIENT_ID:-}
      GOOGLE_SEO_OAUTH_CLIENT_SECRET: ${GOOGLE_SEO_OAUTH_CLIENT_SECRET:-}
      GOOGLE_SEO_OAUTH_REDIRECT_URI: ${GOOGLE_SEO_OAUTH_REDIRECT_URI:-}
      GOOGLE_SEO_TOKEN_ENCRYPTION_KEY: ${GOOGLE_SEO_TOKEN_ENCRYPTION_KEY:-}
      # Cifra la Application Password de WordPress en SeoProfile. SIN valor
      # por defecto a propósito, al contrario que las tres de arriba: éstas
      # degradan (la conexión OAuth simplemente no se ofrece), pero
      # parseHexKey LANZA cuando ésta falta, así que sin ella guardar o
      # publicar en WordPress devuelve un 500. Dejarla sin `:-` hace que
      # `docker compose up` avise si no está puesta, que es justo lo que
      # faltó aquí: estuvo declarada en el código desde la Fase A de 'seo'
      # y nunca llegó al contenedor — el mismo hueco que tuvo
      # GOOGLE_PLACES_API_KEY. Generar con: openssl rand -hex 32
      SEO_CMS_CREDENTIAL_ENCRYPTION_KEY: ${SEO_CMS_CREDENTIAL_ENCRYPTION_KEY}
      GOOGLE_GA4_OAUTH_CLIENT_ID: ${GOOGLE_GA4_OAUTH_CLIENT_ID:-}
      GOOGLE_GA4_OAUTH_CLIENT_SECRET: ${GOOGLE_GA4_OAUTH_CLIENT_SECRET:-}
      GOOGLE_GA4_OAUTH_REDIRECT_URI: ${GOOGLE_GA4_OAUTH_REDIRECT_URI:-}
      GOOGLE_GA4_TOKEN_ENCRYPTION_KEY: ${GOOGLE_GA4_TOKEN_ENCRYPTION_KEY:-}
      DRIVE_PARENT_FOLDER_ID: ${DRIVE_PARENT_FOLDER_ID:-}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-}
      PAPERCLIP_DAY2_AGENT_ID: ${PAPERCLIP_DAY2_AGENT_ID:-}
      KAIRIKOS_CEO_EMAIL: ${KAIRIKOS_CEO_EMAIL:-}
      KAIRIKOS_OPERATOR_EMAILS: ${KAIRIKOS_OPERATOR_EMAILS:-}
      KAIRIKOS_NOTIFY_KINDS: ${KAIRIKOS_NOTIFY_KINDS:-}
      OPERATOR_NOTIFY_FROM: ${OPERATOR_NOTIFY_FROM:-}
      PORTAL_ANALYTICS_ENDPOINT: ${PORTAL_ANALYTICS_ENDPOINT:-}
      PORTAL_ANALYTICS_SITE_ID: ${PORTAL_ANALYTICS_SITE_ID:-}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      # WhatsApp Coexistence de 'recall' — Embedded Signup Configuration
      # separada de META_CONFIG_ID (esa es para los canales normales del
      # chatbot). isCoexistenceSignupConfigured() la comprueba junto a
      # META_APP_ID/META_APP_SECRET, ya wireados arriba — ver lib/meta-business.ts.
      META_COEXISTENCE_CONFIG_ID: ${META_COEXISTENCE_CONFIG_ID:-}
      # Pre-UI fallback only — un operador puede pegar los cuatro valores
      # de Meta de arriba en /admin/portal/settings/meta en su lugar
      # (cifrado en Postgres con esta clave). Generar con:
      # openssl rand -hex 32
      META_CREDENTIAL_ENCRYPTION_KEY: ${META_CREDENTIAL_ENCRYPTION_KEY:-}
      # Telefonía del producto 'recall'. Sin las dos primeras, el pool de
      # números queda deshabilitado y sus rutas de operador devuelven 503;
      # nada más del portal se ve afectado. El bundle/address regulatorio
      # es del prestador del servicio y se da de alta una sola vez, no por
      # cliente — ver .env.production.example.
      # Pre-UI fallback only — an operator can now paste these at
      # /admin/portal/settings/telephony instead (encrypted at rest with
      # TWILIO_CREDENTIAL_ENCRYPTION_KEY, stored in Postgres), same
      # relationship STRIPE_SECRET_KEY has to Stripe's settings UI.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # Generate with: openssl rand -hex 32
      TWILIO_CREDENTIAL_ENCRYPTION_KEY: ${TWILIO_CREDENTIAL_ENCRYPTION_KEY:-}
      TWILIO_BUNDLE_SID: ${TWILIO_BUNDLE_SID:-}
      TWILIO_ADDRESS_SID: ${TWILIO_ADDRESS_SID:-}
      TWILIO_VOICE_WEBHOOK_URL: ${TWILIO_VOICE_WEBHOOK_URL:-}
      # Origen público que Twilio usa para firmar sus webhooks. Detrás de
      # nginx la app ve el host interno, así que sin esto la URL que
      # reconstruye no coincide con la que Twilio firmó y fallan TODAS
      # las firmas. Fíjalo en producción.
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-}
      # Transcripción — decisión del 2026-09-08: Groq en local Y en
      # producción; el autoalojado se resuelve más adelante. El servicio
      # `whisper` de aquí abajo sigue definido, detrás del perfil
      # `selfhosted`, para poder volver.
      #
      # OJO: esto manda la voz de quien llamó a un tercero en EE. UU.
      # Groq es SUBENCARGADO y hay que declararlo en el contrato de
      # encargo de cada cliente. Ver la cabecera de src/lib/whisper.ts.
      WHISPER_BASE_URL: ${WHISPER_BASE_URL:-https://api.groq.com/openai}
      # 'whisper-1' es el nombre de OpenAI y Groq lo RECHAZA. El defecto
      # tiene que ser el del proveedor al que se apunta, o la primera
      # transcripción en producción falla con un 400.
      WHISPER_MODEL: ${WHISPER_MODEL:-whisper-large-v3}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-es}
      # SIN valor por defecto: contra Groq es obligatoria (responde 401 sin
      # ella) y así `docker compose up` avisa si falta. Solo el contenedor
      # autoalojado funcionaba sin clave.
      WHISPER_API_KEY: ${WHISPER_API_KEY}
      # Stripe already has an admin-configurable fallback
      # (/admin/portal/settings/billing → StripeOperatorCredential) — these
      # env vars are only the pre-UI fallback, not required to boot billing.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CREDENTIAL_ENCRYPTION_KEY: ${STRIPE_CREDENTIAL_ENCRYPTION_KEY:-}
      # 'prospecting' — Google Places has the same admin-configurable
      # fallback pattern as Stripe above (/admin/portal/settings/integrations
      # → IntegrationCredential). GOOGLE_PLACES_API_KEY was never wired in
      # here when Fase A shipped it — same class of gap as Stripe's own
      # env vars, fixed alongside the new encryption key it now shares
      # this pattern with.
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      INTEGRATION_CREDENTIAL_ENCRYPTION_KEY: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-net
      # Esta VPS concreta ya tiene Traefik ocupando el 80/443 para n8n
      # (root-traefik-1, pila del proyecto Compose "root") — el nginx +
      # certbot de más abajo NO se levantan aquí, se quedarían sin poder
      # publicar esos puertos. En su lugar, `app` se une a la red de esa
      # pila para que Traefik pueda alcanzarlo por nombre de contenedor,
      # y las etiquetas de abajo son el mismo patrón que ya usa n8n
      # (ver traefik.http.routers.n8n.* en `docker inspect root-n8n-1`):
      # mismo certresolver, misma pareja de entrypoints. Red declarada
      # como externa más abajo — la crea la pila de Traefik, no ésta.
      - root_default
    labels:
      traefik.enable: "true"
      # `app` está en DOS redes (portal-net y root_default), y sin esto
      # Traefik elige por su cuenta cuál usar para conectar — el 10 de
      # septiembre de 2026 eligió portal-net (donde Traefik ni siquiera
      # está), así que cada petición a portal.kairikos.cloud colgaba
      # hasta agotar el timeout: TLS terminaba bien, pero nunca llegaba
      # a la app. root_default es la única red que comparte con Traefik
      # — tiene que ser explícita, no una de las dos por defecto.
      traefik.docker.network: "root_default"
      traefik.http.routers.portal.rule: "Host(`portal.kairikos.cloud`)"
      traefik.http.routers.portal.entrypoints: "web,websecure"
      traefik.http.routers.portal.tls: "true"
      traefik.http.routers.portal.tls.certresolver: "mytlschallenge"
      traefik.http.routers.portal.middlewares: "portal@docker"
      traefik.http.services.portal.loadbalancer.server.port: "3000"
      traefik.http.middlewares.portal.headers.SSLRedirect: "true"
      traefik.http.middlewares.portal.headers.SSLHost: "portal.kairikos.cloud"
      traefik.http.middlewares.portal.headers.STSSeconds: "31536000"
      traefik.http.middlewares.portal.headers.STSIncludeSubdomains: "true"
      traefik.http.middlewares.portal.headers.STSPreload: "true"
      traefik.http.middlewares.portal.headers.forceSTSHeader: "true"
      traefik.http.middlewares.portal.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.portal.headers.browserXSSFilter: "true"
      traefik.http.middlewares.portal.headers.frameDeny: "true"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: kairikos-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairikos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairikos_portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, only on a genuinely empty data directory — see the
      # file's own header for why this exists (a legacy migration
      # depends on Supabase-only roles this plain Postgres image
      # doesn't have).
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - portal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No host port exposure — only the app container can reach postgres,
    # via the internal Docker network. Production posture preserved in
    # both modes.

  # Daily pg_dump, gzipped, kept BACKUP_RETENTION_DAYS (default 14) —
  # see scripts/backup-postgres.sh. NOT behind the `proxy` profile: runs
  # in both deploy modes, since data matters regardless of TLS status.
  # Volume-only backup (no off-box copy) — the `backups` volume still
  # lives on the same VPS/disk as `pgdata`, so this protects against a
  # bad migration or an accidental DROP, not against losing the VPS
  # itself. Pull `backups/` off-box periodically (e.g. rclone to
  # object storage) once that matters more than shipping features.
  backup:
    # Built from scripts/backup.Dockerfile (build-support-images.yml),
    # not the bare postgres:16-alpine + a bind-mounted script anymore —
    # see that Dockerfile's header comment for why: the VPS deploy
    # pipeline only ever syncs this file's CONTENT, never the rest of
    # the repo, so a bind-mounted script silently went stale forever.
    image: ghcr.io/lagop/kairikos-chatbotai-dash/portal-backup:latest
    pull_policy: always
    container_name: kairikos-portal-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairikos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairikos_portal}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-net

  # The scheduler. Same loop+sleep+trap idiom as `backup` and `certbot`.
  #
  # This stack has had /api/cron/* routes and a `crons` block in
  # vercel.json for a long time — but vercel.json is inert under Docker,
  # so nothing ever called them. Every scheduled behaviour the portal
  # believed it had was silently not running. This is the missing caller.
  #
  # It knows nothing about what is due: it hits one endpoint on a fixed
  # cadence and the application works out what that tick implies, so the
  # scheduling logic stays in TypeScript where it is unit-tested rather
  # than in a crontab nobody can test.
  scheduler:
    # Built from scripts/scheduler.Dockerfile (build-support-images.yml),
    # not the bare curlimages/curl + a bind-mounted script anymore —
    # same staleness reasoning as the `backup` service above.
    image: ghcr.io/lagop/kairikos-chatbotai-dash/portal-scheduler:latest
    pull_policy: always
    container_name: kairikos-portal-scheduler
    restart: unless-stopped
    environment:
      # The app is only reachable on the internal network; there is no
      # reason for scheduled work to leave the box and come back.
      SCHEDULER_TARGET_URL: ${SCHEDULER_TARGET_URL:-http://app:3000}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}
      SCHEDULER_TIMEOUT_SECONDS: ${SCHEDULER_TIMEOUT_SECONDS:-120}
      # Same secret the /api/cron/* routes already expect. The script
      # refuses to start without it rather than spinning on 401s, which
      # would look exactly like working.
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - portal-net

  # Speech-to-text for the 'recall' product, self-hosted.
  #
  # On the VPS rather than a transcription API for two reasons that both
  # outweigh the (negligible) cost difference:
  #
  #   1. RGPD. We are the processor and the client is the controller of a
  #      third party's recorded voice. Keeping transcription here means
  #      the caller's voice never leaves infrastructure already covered by
  #      the client's processing agreement — no sub-processor to declare.
  #   2. Zero marginal cost. "Modo Recado" takes 30-60s messages, so a
  #      50-client book is ~12 hours of audio a month.
  #
  # No host port: only the app container reaches it, over the internal
  # Docker network. Same posture as postgres.
  #
  # The image speaks the OpenAI-compatible /v1/audio/transcriptions shape,
  # so if self-hosting ever becomes a burden, pointing WHISPER_BASE_URL at
  # a hosted endpoint is a config change rather than a rewrite.
  #
  # Model sizing: `small` is the sweet spot for Spanish on CPU — `base`
  # mangles proper nouns and street names, `medium` roughly triples the
  # time per clip for little gain on 30-60s recordings. Raise it if the
  # VPS has cores to spare.
  whisper:
    image: hwdsl2/whisper-server
    container_name: kairikos-portal-whisper
    restart: unless-stopped
    # Decisión del 2026-09-08: hoy se transcribe con Groq, así que este
    # contenedor NO arranca por defecto — levantarlo para no usarlo solo
    # gastaría CPU y descargaría pesos de modelo en cada VPS.
    #
    # Se conserva definido, y no borrado, porque el autoalojado es el
    # camino de vuelta y su razón sigue en pie (ver la cabecera de
    # src/lib/whisper.ts): con él, Groq deja de ser subencargado y
    # desaparece la transferencia internacional.
    #
    # Para volver:
    #   docker compose --profile selfhosted up -d whisper
    #   y en el .env:  WHISPER_BASE_URL=http://whisper:9000
    #                  WHISPER_MODEL=whisper-1
    #                  (WHISPER_API_KEY deja de hacer falta)
    profiles: ["selfhosted"]
    environment:
      # OJO, no es la misma variable que la WHISPER_MODEL del servicio
      # `app`: aquella dice qué modelo PEDIR al endpoint, ésta con qué
      # pesos arranca este contenedor. Nombres distintos a propósito.
      WHISPER_MODEL: ${WHISPER_ASR_MODEL:-small}
      WHISPER_DEVICE: cpu
    volumes:
      # Model weights download on first boot; without this the download
      # repeats on every container recreate.
      - whisper-data:/var/lib/whisper
    networks:
      - portal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous on purpose: the first boot downloads the model weights
      # before the service can answer anything.
      start_period: 300s

  # nginx + certbot are in the `proxy` profile. Start them with:
  #   docker compose --profile proxy up -d
  # The Hostinger Docker Manager doesn't run profiles by default, so the
  # CEO leaves these dormant for dev-ip-port mode and enables them only
  # when DEPLOY_MODE=prod-dns-tls.
  #
  # NO los levantes en la VPS de producción actual (srv1170607.hstgr.cloud):
  # ya tiene Traefik publicando el 80/443 para n8n (root-traefik-1, pila
  # Compose "root"). Este par se quedaría sin puertos que publicar y
  # fallaría al arrancar. En esa máquina, el enrutado y el TLS del portal
  # van por las etiquetas `traefik.*` del servicio `app`, no por aquí —
  # el par nginx/certbot se conserva definido solo para un despliegue
  # FUTURO en una VPS sin proxy previo.
  nginx:
    profiles: ["proxy"]
    image: nginx:1.25-alpine
    container_name: kairikos-portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - portal-net

  certbot:
    profiles: ["proxy"]
    image: certbot/certbot
    container_name: kairikos-portal-certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  pgdata:
    name: kairikos-portal-pgdata
  backups:
    name: kairikos-portal-backups
  # Whisper model weights. Named so a `docker compose down` doesn't force
  # a multi-hundred-megabyte re-download on the next boot.
  whisper-data:
    name: kairikos-portal-whisper-data
  certs:
  certbot-www:

networks:
  portal-net:
    driver: bridge
  # La red del proyecto Compose "root" (/root/docker-compose.yml en la
  # VPS), donde vive Traefik junto a n8n. `external: true` porque esta
  # pila no la crea ni la gestiona — solo se une a una que ya existe. Si
  # el nombre real difiere de root_default (`docker network ls` en la
  # VPS lo confirma), es la única línea que hay que tocar aquí.
  root_default:
    external: true
