# =============================================================================
# Kairikos — Docker Compose for the end-client portal
#
# This compose references a PRE-BUILT image at ghcr.io, so the Hostinger
# Docker Manager (which only fetches a single file) can deploy it without
# needing access to the Dockerfile, package.json, or Prisma schema.
#
# The image is built and pushed by .github/workflows/build-image.yml on
# every push to main that touches portal/**. Latest tag is always:
#   ghcr.io/lagop/kairikos-chatbotai-dash/portal-app:latest
#
# Deploy modes (selected by DEPLOY_MODE env var):
#
#   DEPLOY_MODE=dev-ip-port   (default for now)
#     - App exposed directly on a host port (default 3001, override with APP_PORT)
#     - No nginx, no certbot, no DNS needed
#     - Access the portal at http://<VPS_IP>:3001
#     - Use this when kairikos.com is hosted elsewhere and you just need to
#       see the portal working end-to-end on the VPS.
#
#   DEPLOY_MODE=prod-dns-tls
#     - Full stack: nginx reverse proxy + certbot auto-renewal on 80/443
#     - Requires portal.kairikos.com DNS pointing at the VPS
#     - Use this for production. Run certbot once after first deploy to
#       bootstrap the TLS cert.
# =============================================================================

services:
  app:
    image: ghcr.io/lagop/kairikos-chatbotai-dash/portal-app:latest
    container_name: kairikos-portal-app
    restart: unless-stopped
    # dev-ip-port mode: expose the app directly on APP_PORT (default 3001).
    # prod-dns-tls mode: nginx proxies to app:3000 internally, so the app
    # only needs to be reachable on the internal Docker network.
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Kairikos Portal <hola@kairikos.com>}
      AUTH_SUPPORT_EMAIL: ${AUTH_SUPPORT_EMAIL:-hola@kairikos.com}
      AUTH_SUPPORT_WHATSAPP: ${AUTH_SUPPORT_WHATSAPP:-https://wa.me/34600000000}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # NEXTAUTH_URL must match how the user reaches the portal:
      #   dev mode:  http://<VPS_IP>:3001
      #   prod mode: https://portal.kairikos.com
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PORTAL_API_KEY: ${PORTAL_API_KEY}

      # --- Required for Canales (chatbot channel activation), the cron
      # routes, operator 2FA, and the QA/operator-key bypass. Without
      # these, the app still boots, but those features are dead — see
      # .env.production.example for how to generate each one.
      CHANNEL_CREDENTIAL_ENCRYPTION_KEY: ${CHANNEL_CREDENTIAL_ENCRYPTION_KEY}
      OPERATOR_TOTP_ENCRYPTION_KEY: ${OPERATOR_TOTP_ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      KAIA_OPERATOR_API_KEY: ${KAIA_OPERATOR_API_KEY}
      N8N_CHANNEL_WEBHOOK_URL: ${N8N_CHANNEL_WEBHOOK_URL}
      N8N_CHANNEL_WEBHOOK_SECRET: ${N8N_CHANNEL_WEBHOOK_SECRET}
      N8N_TELEGRAM_WEBHOOK_BASE_URL: ${N8N_TELEGRAM_WEBHOOK_BASE_URL}
      N8N_WEBCHAT_URL: ${N8N_WEBCHAT_URL}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_CONFIG_ID: ${META_CONFIG_ID}

      # --- Optional — leave blank until you activate the matching
      # product. The app degrades gracefully (feature just shows as
      # "not configured") when any of these are unset; nothing below
      # this line blocks the first deploy. See .env.production.example
      # for what each group turns on.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_BUSINESS_OAUTH_CLIENT_ID: ${GOOGLE_BUSINESS_OAUTH_CLIENT_ID:-}
      GOOGLE_BUSINESS_OAUTH_CLIENT_SECRET: ${GOOGLE_BUSINESS_OAUTH_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_OAUTH_REDIRECT_URI: ${GOOGLE_BUSINESS_OAUTH_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      DRIVE_PARENT_FOLDER_ID: ${DRIVE_PARENT_FOLDER_ID:-}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-}
      PAPERCLIP_API_URL: ${PAPERCLIP_API_URL:-}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID:-}
      PAPERCLIP_DAY2_AGENT_ID: ${PAPERCLIP_DAY2_AGENT_ID:-}
      KAIRIKOS_CEO_EMAIL: ${KAIRIKOS_CEO_EMAIL:-}
      KAIRIKOS_OPERATOR_EMAILS: ${KAIRIKOS_OPERATOR_EMAILS:-}
      KAIRIKOS_NOTIFY_KINDS: ${KAIRIKOS_NOTIFY_KINDS:-}
      OPERATOR_NOTIFY_FROM: ${OPERATOR_NOTIFY_FROM:-}
      PORTAL_ANALYTICS_ENDPOINT: ${PORTAL_ANALYTICS_ENDPOINT:-}
      PORTAL_ANALYTICS_SITE_ID: ${PORTAL_ANALYTICS_SITE_ID:-}
      NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      # Stripe already has an admin-configurable fallback
      # (/admin/portal/settings/billing → StripeOperatorCredential) — these
      # env vars are only the pre-UI fallback, not required to boot billing.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CREDENTIAL_ENCRYPTION_KEY: ${STRIPE_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: kairikos-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairikos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairikos_portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - portal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No host port exposure — only the app container can reach postgres,
    # via the internal Docker network. Production posture preserved in
    # both modes.

  # nginx + certbot are in the `proxy` profile. Start them with:
  #   docker compose --profile proxy up -d
  # The Hostinger Docker Manager doesn't run profiles by default, so the
  # CEO leaves these dormant for dev-ip-port mode and enables them only
  # when DEPLOY_MODE=prod-dns-tls.
  nginx:
    profiles: ["proxy"]
    image: nginx:1.25-alpine
    container_name: kairikos-portal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - portal-net

  certbot:
    profiles: ["proxy"]
    image: certbot/certbot
    container_name: kairikos-portal-certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"

volumes:
  pgdata:
    name: kairikos-portal-pgdata
  certs:
  certbot-www:

networks:
  portal-net:
    driver: bridge
