# portal.kairikos.com — TLS termination + reverse proxy to the Next.js app.
#
# This config handles BOTH the certbot http-01 challenge (port 80) and the
# production traffic (port 443, TLS 1.3). The first time you bring this up
# you will need to obtain a cert manually:
#
#   docker compose run --rm certbot certonly --webroot \
#     --webroot-path /var/www/certbot \
#     -d portal.kairikos.com --agree-tos -m ops@kairikos.com
#
# After that, the certbot sidecar renews automatically every 12h.

# HTTP — for certbot http-01 challenge and HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name portal.kairikos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — production traffic.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.kairikos.com;

    ssl_certificate     /etc/letsencrypt/live/portal.kairikos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.kairikos.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options          "DENY"                       always;
    add_header X-Content-Type-Options   "nosniff"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to the Next.js app container
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
