name: Secrets leak check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets:
    name: Plain-text secret scan (KAIA-1597)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run secrets check
        run: bash scripts/secrets-check.sh
