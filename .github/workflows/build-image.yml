name: Build and push portal image

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'portal/Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: portal-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kairikos-chatbotai-dash/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Dockerfile uses paths like `COPY portal/package.json ...`,
          # which assume the build context is the monorepo root.
          context: .
          file: ./portal/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-from or cache-to — the GHA runner's default `docker`
          # driver doesn't support the `gha` cache backend (unknown cache
          # importer) AND doesn't support cache export. The first attempt
          # had cache-from: type=gha which failed with:
          #   ERROR: unknown cache importer: gha
          # So we drop both. Docker's default layer cache still works
          # (it just won't survive between runs). For production builds
          # with persistent caching, switch the runner to the
          # `docker-container` driver via docker/setup-buildx-action.
          # For this one-off dev-point build, the build is fast enough
          # without cross-run cache (~2-3 min cold).
