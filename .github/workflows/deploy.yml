name: Deploy to Hostinger VPS

# Hasta ahora este workflow y build-image.yml disparaban ambos, en
# paralelo, sobre el mismo push — sin ningún orden garantizado entre
# "la imagen nueva ya está en ghcr.io" y "Hostinger aplica el
# docker-compose.yml que la referencia". Confirmado repetidas veces
# esta sesión comparando digests antes/después de un pull manual: el
# deploy llegaba a veces antes de que la imagen terminara de subir, y
# el contenedor se quedaba con la anterior hasta forzar un
# --force-recreate a mano.
#
# Arreglo: cuando el push SÍ toca portal/** (o scripts/**, que ahora
# también produce imagen — ver build-support-images.yml), este
# workflow ya NO dispara por push directo — espera al evento
# workflow_run de cualquiera de esas dos construcciones, así que el
# deploy solo puede empezar cuando la imagen que va a desplegar ya
# existe de verdad. Un push que NO toca ninguna imagen (docker-compose.yml,
# este mismo archivo, nginx/, etc.) no necesita esperar a nada —
# paths-ignore deja que el trigger por push siga disparando directo
# para esos casos, igual que antes.
on:
  push:
    branches: [main, kaia-743-staging-runner]
    paths-ignore:
      - 'portal/**'
      - 'scripts/scheduler.sh'
      - 'scripts/backup-postgres.sh'
      - 'scripts/scheduler.Dockerfile'
      - 'scripts/backup.Dockerfile'
  workflow_run:
    workflows: ['Build and push portal image', 'Build and push scheduler/backup images']
    types: [completed]
    branches: [main, kaia-743-staging-runner]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Un workflow_run cuyo build falló no debe desplegar nada — desplegaría
    # la imagen VIEJA bajo la falsa impresión de que el código nuevo ya
    # está en producción. Los otros dos disparadores (push, workflow_dispatch)
    # no tienen "conclusion" que comprobar, así que solo se filtra cuando
    # el evento es realmente workflow_run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        # En un workflow_run, github.sha/github.ref apuntan al ESTADO
        # ACTUAL de la rama del propio workflow, no necesariamente al
        # commit exacto que se acaba de construir — head_sha del evento
        # sí lo es. Sin este ref explícito, un push muy rápido entre la
        # construcción y el deploy podría desplegar código más nuevo del
        # que la imagen recién construida realmente contiene.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: kairikos-portal
          # Path is repo-relative, no leading "./" — the action builds
          # the URL as `$server/$repo/blob/$sha/$path` and a "./" prefix
          # produces a malformed URL that the Hostinger API may reject
          # with "content field is required".
          docker-compose-path: docker-compose.yml
          # All secrets that docker-compose.yml references must be passed
          # here. The hostinger action exposes these as env vars to the
          # `docker compose` invocation on the VPS. The CEO is responsible
          # for adding them as GitHub repo secrets (Settings → Secrets and
          # variables → Actions → New repository secret):
          #
          #   Required GitHub secrets (the app boots but these features
          #   stay dead without each one — see docker-compose.yml's own
          #   comments on the "Required for Canales" block for detail):
          #     HOSTINGER_API_KEY              Hostinger hPanel API key
          #     POSTGRES_PASSWORD              openssl rand -hex 24
          #     AUTH_SECRET                    openssl rand -base64 32
          #     RESEND_API_KEY                 https://resend.com/api-keys
          #     PORTAL_API_KEY                 openssl rand -hex 32
          #     CHANNEL_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32
          #     OPERATOR_TOTP_ENCRYPTION_KEY       openssl rand -hex 32
          #     CRON_SECRET                        openssl rand -hex 32
          #     SEO_CMS_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32 —
          #       si ya hay contraseñas de WordPress cifradas en esta VPS,
          #       tiene que ser la MISMA clave que se usó entonces.
          #     STRIPE_CREDENTIAL_ENCRYPTION_KEY   openssl rand -hex 32 —
          #       misma cautela: si ya hay una clave de Stripe cifrada en
          #       esta VPS, tiene que ser la MISMA clave que se usó al
          #       guardarla, o deja de poder descifrarse.
          #     INTEGRATION_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32 —
          #       cifra las claves de terceros que pega el operador en
          #       /admin/portal/settings/integrations (hoy: Google Places).
          #       Si ya hay alguna guardada en esta VPS, tiene que ser la
          #       MISMA clave, o deja de poder descifrarse.
          #     STRIPE_WEBHOOK_SECRET           el "Signing secret" (whsec_…)
          #       del endpoint configurado en Stripe → Developers → Webhooks
          #     WHISPER_API_KEY                de https://console.groq.com/keys
          #     ANTHROPIC_API_KEY              https://console.anthropic.com/settings/keys —
          #       una sola clave alimenta TODO el motor de IA del portal, no
          #       solo el clasificador de "Captación con IA": el motor
          #       conversacional del propio chatbot (chatbot-reply-ai.ts),
          #       las respuestas de reseñas, los resúmenes de conversación y
          #       la generación de contenido SEO. Sin ella, cada uno degrada
          #       en silencio (nunca lanza) — el chatbot en concreto no
          #       manda NINGUNA respuesta real a un cliente final, no un
          #       fallback: `skipped: true, reason: 'no_api_key'` se propaga
          #       hasta replyToIncomingMessage sin enviar nada al canal.
          #     ANTHROPIC_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32 —
          #       cifra la clave de Anthropic cuando se guarda desde
          #       /admin/portal/settings/anthropic en vez de solo vivir en
          #       ANTHROPIC_API_KEY. Mismo molde que
          #       STRIPE_CREDENTIAL_ENCRYPTION_KEY: si ya hay una clave
          #       guardada con otra clave de cifrado en esta VPS, tiene que
          #       ser la MISMA o deja de poder descifrarse.
          #     META_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32 —
          #       la misma trampa que ya tuvieron Stripe y Anthropic: está
          #       en docker-compose.yml desde antes de que existiera esta
          #       plantilla, pero nunca se añadió aquí, así que nunca ha
          #       llegado al .env real de la VPS. Cifra el App Secret de
          #       Meta guardado desde /admin/portal/settings/meta — sin
          #       ella, guardar o leer esa credencial falla.
          #     TWILIO_CREDENTIAL_ENCRYPTION_KEY  openssl rand -hex 32 —
          #       la misma trampa, la cuarta vez: NINGUNA de las 7 variables
          #       TWILIO_* de docker-compose.yml llegaba aquí, así que
          #       'recall' tenía cero infraestructura en producción — sin
          #       credencial de Twilio guardada, sin número virtual, sin
          #       ninguna suscripción. Esta clave es la que cifra el Auth
          #       Token guardado desde /admin/portal/settings/telephony.
          #     TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN  de la consola de
          #       Twilio — respaldo previo a la pantalla de ajustes, como
          #       Stripe/Meta/Anthropic; no hace falta rellenarlos aquí si
          #       vas a pegarlos directamente en el panel.
          #     TWILIO_BUNDLE_SID / TWILIO_ADDRESS_SID  el trámite regulatorio
          #       de numeración española, una vez dado de alta en Twilio —
          #       mismo respaldo previo al panel, no secretos en sí.
          #
          #   Required GitHub variables:
          #     HOSTINGER_VM_ID     (from the VPS URL)
          #     POSTGRES_USER       (default: kairikos)
          #     POSTGRES_DB         (default: kairikos_portal)
          #     NEXTAUTH_URL        prod-dns-tls mode: https://portal.kairikos.cloud
          #                         (Traefik ya enruta ese dominio en esta
          #                         VPS — ver las etiquetas traefik.* del
          #                         servicio `app` en docker-compose.yml)
          #
          # Generate secrets on the CEO's workstation with the noted command
          # and paste the output. Never commit secrets to the repo.
          #
          # NO se incluyen aquí (a propósito) las variables opcionales de
          # Meta/Google/Twilio/Stripe: todas degradan con gracia sin valor
          # — ver el bloque "Optional" de docker-compose.yml — y activarlas
          # es un paso posterior, producto a producto, no parte del primer
          # despliegue. ANTHROPIC_API_KEY salió de ese grupo el 13 de
          # septiembre: es el paso de activación de "Captación con IA" (y de
          # que el chatbot conteste de verdad), así que ya viaja aquí en vez
          # de quedar solo en docker-compose.yml.
          environment-variables: |
            NODE_ENV=production
            DATABASE_URL=postgresql://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ vars.POSTGRES_DB }}
            DIRECT_URL=postgresql://${{ vars.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_EMAIL_FROM=Kairikos Portal <contacto@kairikos.com>
            AUTH_SUPPORT_EMAIL=contacto@kairikos.com
            AUTH_SUPPORT_WHATSAPP=https://wa.me/34624514425
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
            NEXT_PUBLIC_PORTAL_URL=${{ vars.NEXT_PUBLIC_PORTAL_URL }}
            PORTAL_API_KEY=${{ secrets.PORTAL_API_KEY }}
            CHANNEL_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.CHANNEL_CREDENTIAL_ENCRYPTION_KEY }}
            OPERATOR_TOTP_ENCRYPTION_KEY=${{ secrets.OPERATOR_TOTP_ENCRYPTION_KEY }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            SEO_CMS_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.SEO_CMS_CREDENTIAL_ENCRYPTION_KEY }}
            STRIPE_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.STRIPE_CREDENTIAL_ENCRYPTION_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            WHISPER_API_KEY=${{ secrets.WHISPER_API_KEY }}
            WHISPER_BASE_URL=https://api.groq.com/openai
            WHISPER_MODEL=whisper-large-v3
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            ANTHROPIC_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.ANTHROPIC_CREDENTIAL_ENCRYPTION_KEY }}
            VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
            VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}
            VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}
            # El pack 'recall' incluye reseñas: sin esta clave no se puede
            # guardar la conexión con Google Business y la invitación a
            # reseña no tiene enlace al que mandar. El par OAuth
            # (GOOGLE_BUSINESS_OAUTH_CLIENT_ID/SECRET) NO va aquí: se pega en
            # /admin/portal/settings/integrations y se guarda cifrado en
            # Postgres. La clave sí tiene que estar en el entorno, y NO SE
            # ROTA una vez haya conexiones: los refresh tokens cifrados con
            # la anterior dejarían de poder leerse.
            GOOGLE_TOKEN_ENCRYPTION_KEY=${{ secrets.GOOGLE_TOKEN_ENCRYPTION_KEY }}
            # A quién le llegan las alertas de operador: altas atascadas,
            # tokens a punto de caducar, conexión de WhatsApp perdida,
            # consumo anómalo. Hasta el 2026-09-15 no estaba aquí, así que
            # en producción NINGUNA alerta se enviaba — resolveOperator-
            # Recipients devolvía [] y cada aviso se saltaba sin error. Lista
            # separada por comas.
            KAIRIKOS_OPERATOR_EMAILS=${{ vars.KAIRIKOS_OPERATOR_EMAILS }}
            # Destinatario de la escalada review-overdue; la ruta falla con
            # 500 ceo_not_configured si está vacío.
            KAIRIKOS_CEO_EMAIL=${{ vars.KAIRIKOS_CEO_EMAIL }}
            META_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.META_CREDENTIAL_ENCRYPTION_KEY }}
            TWILIO_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.TWILIO_CREDENTIAL_ENCRYPTION_KEY }}
            # 23/09/2026 — faltaba aquí desde que existe IntegrationCredential,
            # y por eso guardar la clave de Google Places en
            # /admin/portal/settings/integrations devolvía 500: sin esta
            # variable, parseHexKey lanza y la ruta responde internal_error.
            # Estaba correctamente puesta en docker-compose.yml, que es
            # exactamente lo que hace que el fallo despiste: el despliegue de
            # Hostinger reescribe el .env de la VPS entero desde ESTA lista,
            # así que lo que no esté aquí no llega al contenedor.
            INTEGRATION_CREDENTIAL_ENCRYPTION_KEY=${{ secrets.INTEGRATION_CREDENTIAL_ENCRYPTION_KEY }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_BUNDLE_SID=${{ secrets.TWILIO_BUNDLE_SID }}
            TWILIO_ADDRESS_SID=${{ secrets.TWILIO_ADDRESS_SID }}
            # BASE_URL is the origin only — resolveWebhookUrl (twilio-
            # signature.ts) appends the request path itself. It already
            # falls back to NEXT_PUBLIC_PORTAL_URL when unset, but pinning
            # it explicitly makes a proxy misconfiguration fail loudly
            # instead of silently rejecting every real webhook (see that
            # function's own header comment). VOICE_WEBHOOK_URL, unlike
            # BASE_URL, needs the full path: it's written verbatim as the
            # Twilio number's VoiceUrl at purchase time (recall-numbers.ts).
            TWILIO_WEBHOOK_BASE_URL=${{ vars.NEXT_PUBLIC_PORTAL_URL }}
            TWILIO_VOICE_WEBHOOK_URL=${{ vars.NEXT_PUBLIC_PORTAL_URL }}/api/webhooks/twilio/voice
            N8N_BASE_URL=https://n8n.srv1170607.hstgr.cloud
            # El widget web (public/widget/embed.js) lee esta URL de
            # /api/public/channels/web/config y habla DIRECTO con n8n desde
            # el navegador del visitante -- el portal nunca ve ese tráfico.
            # No es secreta (se manda a cualquier web que pegue el snippet),
            # así que va literal, igual que N8N_BASE_URL. Faltaba aquí desde
            # siempre: sin ella el widget no se rompe (embed.js comprueba
            # chatEndpoint y no se muestra), pero tampoco funciona jamás.
            N8N_WEBCHAT_URL=https://n8n.srv1170607.hstgr.cloud/webhook/kairikos-webchat-multitenant
            # El portal usa esto para registrar el webhook de CADA bot de
            # Telegram que un cliente conecta (telegram/connect/route.ts
            # llama a setWebhook con esta URL mas el parametro connectionId
            # en la query, no como segmento de ruta, porque asi es como el
            # nodo Extract Input del flujo de n8n lo lee. Tambien faltaba
            # aqui: confirmado contra una ejecucion real que Telegram SI
            # llamaba al webhook pero sin query ni params, asi que todo
            # mensaje de cualquier cliente conectado se descartaba en
            # silencio antes de llegar al portal.
            N8N_TELEGRAM_WEBHOOK_BASE_URL=https://n8n.srv1170607.hstgr.cloud/webhook/kairikos-telegram
            DEPLOY_MODE=dev-ip-port
            APP_PORT=3001

      # ---------------------------------------------------------------
      # Comprobar que el despliegue de verdad ocurrió (23/09/2026).
      #
      # El paso de arriba dura ~20 ms: lanza la petición a la API de
      # Hostinger y da SUCCESS sin esperar a que la VPS haga nada. Ese día
      # el PR #242 se desplegó "con éxito" y la VPS siguió doce minutos
      # con la versión anterior — hasta que se relanzó el workflow a mano.
      # Un despliegue en verde no significaba nada, y eso convierte
      # cualquier prueba posterior en una mentira: se prueba un código que
      # no está.
      #
      # Se pregunta a la propia aplicación qué commit corre
      # (/api/internal/health-probe/ping devuelve `revision`, que viene
      # del build-arg BUILD_REVISION). Autenticada con PORTAL_API_KEY,
      # porque la versión desplegada no es dato público.
      #
      # Cinco minutos de margen: el despliegue observado tarda entre uno y
      # dos, y un contenedor que arranca tiene su propia cuesta. Si en ese
      # rato no coincide, el job FALLA — que es el punto: que se entere
      # quien despliega y no el cliente.
      - name: Verificar que la versión desplegada es esta
        env:
          ESPERADA: ${{ github.event.workflow_run.head_sha || github.sha }}
          PORTAL_URL: ${{ vars.NEXT_PUBLIC_PORTAL_URL }}
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
        run: |
          set -u
          if [ -z "${PORTAL_API_KEY}" ] || [ -z "${PORTAL_URL}" ]; then
            echo "::warning::Sin PORTAL_API_KEY o NEXT_PUBLIC_PORTAL_URL no se puede verificar; se omite."
            exit 0
          fi
          echo "Esperando a que ${PORTAL_URL} responda con ${ESPERADA}"
          for intento in $(seq 1 30); do
            RESPUESTA=$(curl -sS --max-time 15 \
              -H "x-kairikos-internal-key: ${PORTAL_API_KEY}" \
              "${PORTAL_URL}/api/internal/health-probe/ping" || true)
            DESPLEGADA=$(printf '%s' "${RESPUESTA}" | sed -n 's/.*"revision":"\([^"]*\)".*/\1/p')
            if [ "${DESPLEGADA}" = "${ESPERADA}" ]; then
              echo "✅ En producción corre ${DESPLEGADA} (intento ${intento})"
              exit 0
            fi
            echo "intento ${intento}/30 — en producción: ${DESPLEGADA:-sin respuesta}"
            sleep 10
          done
          echo "::error::La VPS sigue sin servir ${ESPERADA} cinco minutos después. El despliegue de Hostinger dio OK pero no se aplicó: relanza este workflow y comprueba la VPS."
          exit 1
