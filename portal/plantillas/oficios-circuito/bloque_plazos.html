<section class="{{clase}} seccion seccion--noche circuito-bloque circuito-bloque--plazos" id="{{ancla}}"><div class="contenedor">

    <p class="rotulo">Urgencias</p>
    {{#titulo}}<h2>{{titulo}}</h2>{{/titulo}}
