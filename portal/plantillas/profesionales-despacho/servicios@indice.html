<section class="kv kv-servicios kv-servicios--indice despacho-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <div class="cabeza dibuja"><p class="rotulo">Servicios</p><h2 data-k-titulo-seccion>En qué podemos ayudarle</h2></div>
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>{{telefono}}</a></p>{{/telefono_href}}
  </div>
  <ol class="kv-indice">{{#servicios}}<li><span class="kv-num" aria-hidden="true"></span><div><h3>{{nombre}}</h3>{{#descripcion}}<p>{{descripcion}}</p>{{/descripcion}}</div><span class="icono-caja"><svg aria-hidden="true"><use href="#i-{{#icono}}{{icono}}{{/icono}}{{^icono}}documento{{/icono}}"></use></svg></span></li>{{/servicios}}</ol>
</div></section>
