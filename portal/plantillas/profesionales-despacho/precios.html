<section class="seccion" id="{{ancla}}"><div class="contenedor">
  <div class="cabeza dibuja"><p class="rotulo">Honorarios</p><h2 data-k-titulo-seccion>Honorarios claros desde el principio</h2></div>
  <div class="minuta aparece">
    <p class="minuta-cabeza"><svg aria-hidden="true"><use href="#i-documento"></use></svg><span>Minuta de honorarios</span><span class="minuta-de">{{nombre}}</span></p>
    <table class="minuta-tabla"><thead><tr><th scope="col">Concepto</th><th scope="col">Honorarios</th></tr></thead><tbody>{{#precios.filas}}<tr><th scope="row"><span class="minuta-concepto">{{concepto}}</span>{{#detalle}}<span class="minuta-detalle">{{detalle}}</span>{{/detalle}}</th><td>{{precio}}</td></tr>{{/precios.filas}}</tbody></table>
    {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
  </div>
</div></section>
