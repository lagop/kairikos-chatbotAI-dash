<section class="kv kv-sobre kv-sobre--media despacho-variante" id="{{ancla}}">
  <div class="kv-media-foto">{{#kv_foto_sobre}}<img src="{{kv_foto_sobre}}" alt="{{nombre}}">{{/kv_foto_sobre}}{{^kv_foto_sobre}}<div class="kv-foto-vacia folio-vacio" aria-hidden="true"><svg><use href="#i-edificio"></use></svg></div>{{/kv_foto_sobre}}</div>
  <div class="kv-media-texto">
    <div class="cabeza dibuja"><p class="rotulo">El despacho</p><span class="sobre-antetitulo">Quiénes somos</span><h2 data-k-titulo-seccion>{{nombre}}</h2></div>
    <div class="kv-prosa texto-rico">{{{sobre_html}}}</div>
    {{#cifras.length}}<ul class="kv-cifras">{{#cifras}}<li><strong>{{valor}}</strong>{{#etiqueta}}<span>{{etiqueta}}</span>{{/etiqueta}}</li>{{/cifras}}</ul>{{/cifras.length}}
  </div>
</section>
