    <span class="rotulo">En vídeo</span>
    {{#titulo}}<h2>{{titulo}}</h2>{{/titulo}}
    <svg class="garabato" viewBox="0 0 220 18" aria-hidden="true"><path d="M3 12c25-9 45 6 72-1s44-8 70 0 47 4 72-6"/></svg>

  {{#ejemplo}}</div>{{/ejemplo}}
</div></section>
