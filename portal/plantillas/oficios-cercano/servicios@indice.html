<section class="kv kv-servicios kv-servicios--indice cercano-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <span class="rotulo">Servicios</span>
    <h2 data-k-titulo-seccion>En qué le podemos ayudar</h2>
    <svg class="garabato" viewBox="0 0 220 18" aria-hidden="true"><path d="M3 12c25-9 45 6 72-1s44-8 70 0 47 4 72-6"/></svg>
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>{{telefono}}</a></p>{{/telefono_href}}
  </div>
  <ol class="kv-indice">{{#servicios}}<li><span class="kv-num" aria-hidden="true"></span><div><h3>{{nombre}}</h3>{{#descripcion}}<p>{{descripcion}}</p>{{/descripcion}}</div><span class="icono"><svg aria-hidden="true"><use href="#i-{{#icono}}{{icono}}{{/icono}}{{^icono}}herramienta{{/icono}}"></use></svg></span></li>{{/servicios}}</ol>
</div></section>
