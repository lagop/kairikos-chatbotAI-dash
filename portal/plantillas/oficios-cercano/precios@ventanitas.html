<section class="kv kv-precios kv-precios--ventanitas cercano-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <span class="rotulo">Precios</span>
    <h2 data-k-titulo-seccion>Precios sin sorpresas</h2>
    <svg class="garabato" viewBox="0 0 220 18" aria-hidden="true"><path d="M3 12c25-9 45 6 72-1s44-8 70 0 47 4 72-6"/></svg>
    {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>Pedir presupuesto</a></p>{{/telefono_href}}
  </div>
  <div class="kv-tabla">{{#precios.filas}}<div class="kv-fila-precio"><div class="kv-concepto"><span>{{concepto}}</span>{{#detalle}}<span class="kv-detalle">{{detalle}}</span>{{/detalle}}</div><strong>{{precio}}</strong></div>{{/precios.filas}}</div>
</div></section>
