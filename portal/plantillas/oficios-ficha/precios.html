<section class="seccion" id="{{ancla}}"><div class="contenedor">
  <div class="cabeza"><div><p class="etiqueta">Precios</p><h2>Tarifas orientativas</h2></div></div>
  <table class="tabla aparece">
    <thead><tr><th scope="col">Concepto</th><th scope="col">Detalle</th><th scope="col" class="precio">Precio</th></tr></thead>
    <tbody>{{#precios.filas}}<tr><th scope="row">{{concepto}}</th><td>{{detalle}}</td><td class="precio">{{precio}}</td></tr>{{/precios.filas}}</tbody>
  </table>
  {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
</div></section>
