<section class="kv kv-precios kv-precios--ventanitas ficha-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <p class="etiqueta">Precios</p>
    <h2 data-k-titulo-seccion>Tarifas orientativas</h2>
    {{#precios.nota}}<p class="kv-suave">{{precios.nota}}</p>{{/precios.nota}}
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>Pedir presupuesto</a></p>{{/telefono_href}}
  </div>
  <div class="kv-tabla"><div class="ficha-tabla-cabeza" aria-hidden="true"><span>Concepto</span><span>Precio</span></div>{{#precios.filas}}<div class="kv-fila-precio"><div class="kv-concepto"><span>{{concepto}}</span>{{#detalle}}<span class="kv-detalle">{{detalle}}</span>{{/detalle}}</div><strong>{{precio}}</strong></div>{{/precios.filas}}</div>
</div></section>
