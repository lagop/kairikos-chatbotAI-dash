<section class="kv kv-sobre kv-sobre--media ficha-variante" id="{{ancla}}">
  <div class="kv-media-foto">{{#kv_foto_sobre}}<img src="{{kv_foto_sobre}}" alt="{{nombre}}">{{/kv_foto_sobre}}{{^kv_foto_sobre}}<div class="kv-foto-vacia" aria-hidden="true"></div>{{/kv_foto_sobre}}</div>
  <div class="kv-media-texto">
    <p class="etiqueta">Quiénes somos</p>
    <h2 data-k-titulo-seccion>{{nombre}}</h2>
    <div class="kv-prosa texto-rico">{{{sobre_html}}}</div>
    {{#cifras.length}}<ul class="kv-cifras">{{#cifras}}<li><strong>{{valor}}</strong>{{#etiqueta}}<span>{{etiqueta}}</span>{{/etiqueta}}</li>{{/cifras}}</ul>{{/cifras.length}}
  </div>
</section>
