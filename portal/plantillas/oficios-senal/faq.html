<section class="seccion" id="{{ancla}}"><div class="contenedor faq-rejilla">
  <div class="faq-lado">
    <span class="rotulo">Preguntas frecuentes</span>
    <h2 data-k-titulo-seccion>Antes de llamar</h2>
    {{#telefono}}<p>¿No encuentra su duda? Llámenos y se la resolvemos.</p><a href="tel:{{telefono_href}}">{{telefono}}</a>{{/telefono}}
  </div>
  <div class="preguntas">{{#faq}}<details class="aparece"><summary>{{pregunta}}</summary><div class="respuesta">{{{respuesta_html}}}</div></details>{{/faq}}</div>
</div></section>
