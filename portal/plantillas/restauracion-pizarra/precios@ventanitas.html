<section class="kv kv-precios kv-precios--ventanitas pizarra-variante seccion--mantel" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <p class="rotulo">La pizarra</p>
    <h2 data-k-titulo-seccion>Precios de hoy</h2>
    {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>Reservar mesa</a></p>{{/telefono_href}}
  </div>
  <div class="kv-tabla">{{#precios.filas}}<div class="kv-fila-precio"><div class="kv-concepto"><span>{{concepto}}</span>{{#detalle}}<span class="kv-detalle">{{detalle}}</span>{{/detalle}}</div><strong>{{precio}}</strong></div>{{/precios.filas}}</div>
</div></section>
