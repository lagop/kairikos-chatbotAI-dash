<section class="seccion seccion--pared" id="{{ancla}}"><div class="contenedor">
  <div class="pizarra pizarra--carta">
    <div class="cabeza"><p class="rotulo">La pizarra</p><h2 data-k-titulo-seccion>Precios de hoy</h2></div>
    <ul class="carta">{{#precios.filas}}<li class="carta-linea aparece"><div class="carta-fila"><h3>{{concepto}}</h3><span class="puntos" aria-hidden="true"></span><p class="precio">{{precio}}</p></div>{{#detalle}}<p class="carta-detalle">{{detalle}}</p>{{/detalle}}</li>{{/precios.filas}}</ul>
    {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
  </div>
</div></section>
