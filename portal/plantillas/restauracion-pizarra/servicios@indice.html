<section class="kv kv-servicios kv-servicios--indice pizarra-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <p class="rotulo">La casa</p>
    <h2 data-k-titulo-seccion>Qué te ofrecemos</h2>
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>{{telefono}}</a></p>{{/telefono_href}}
  </div>
  <ol class="kv-indice">{{#servicios}}<li><span class="kv-num" aria-hidden="true"></span><div><h3>{{nombre}}</h3>{{#descripcion}}<p>{{descripcion}}</p>{{/descripcion}}</div><span class="plato"><svg aria-hidden="true"><use href="#i-{{#icono}}{{icono}}{{/icono}}{{^icono}}plato{{/icono}}"></use></svg></span></li>{{/servicios}}</ol>
</div></section>
