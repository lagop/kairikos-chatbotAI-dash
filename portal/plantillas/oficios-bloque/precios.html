<section class="seccion" id="{{ancla}}"><div class="contenedor">
  <div class="cabeza"><p class="rotulo">Precios</p><h2 data-k-titulo-seccion>Precios claros, sin sorpresas</h2></div>
  <ul class="tarifas">{{#precios.filas}}<li class="tarifa aparece"><div class="tarifa-texto"><h3>{{concepto}}</h3>{{#detalle}}<p>{{detalle}}</p>{{/detalle}}</div><p class="precio">{{precio}}</p></li>{{/precios.filas}}</ul>
  {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
</div></section>
