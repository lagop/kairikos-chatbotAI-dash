<section class="kv kv-servicios kv-servicios--indice bloque-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <p class="rotulo">Servicios</p>
    <h2 data-k-titulo-seccion>En qué le podemos ayudar</h2>
    {{#telefono_href}}<p class="acciones"><a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>{{telefono}}</a></p>{{/telefono_href}}
  </div>
  <ol class="kv-indice">{{#servicios}}<li><span class="kv-num" aria-hidden="true"></span><div><h3>{{nombre}}</h3>{{#descripcion}}<p>{{descripcion}}</p>{{/descripcion}}</div><svg class="kv-flecha" aria-hidden="true"><use href="#i-flecha"></use></svg></li>{{/servicios}}</ol>
</div></section>
