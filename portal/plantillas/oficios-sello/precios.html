<section class="seccion seccion--crema" id="{{ancla}}"><div class="contenedor">
  <div class="cabeza"><p class="rotulo">Precios</p><h2 data-k-titulo-seccion>Precios claros, sin sorpresas</h2></div>
  <ul class="tickets">{{#precios.filas}}<li class="ticket aparece"><div class="ticket-cabeza"><h3>{{concepto}}</h3><p class="precio">{{precio}}</p></div>{{#detalle}}<p class="ticket-detalle">{{detalle}}</p>{{/detalle}}</li>{{/precios.filas}}</ul>
  {{#precios.nota}}<p class="nota"><svg aria-hidden="true"><use href="#i-chispa"></use></svg><span>{{precios.nota}}</span></p>{{/precios.nota}}
</div></section>
