<section class="portada" id="{{ancla}}"><div class="contenedor portada-rejilla">
  <div>
    {{#horario_resumen}}<p class="estado">{{horario_resumen}}</p>{{/horario_resumen}}
    <h1>{{titular}}</h1>
    {{#subtitulo}}<p class="entradilla">{{subtitulo}}</p>{{/subtitulo}}
    <div class="acciones">
      {{#telefono_href}}<a class="boton" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-telefono"></use></svg>Pedir cita</a>{{/telefono_href}}
      <a class="boton boton--linea" href="#contacto">Escríbenos</a>
    </div>
  </div>
  {{#fotos.portada}}<figure class="portada-foto">
    <img src="{{fotos.portada}}" alt="El salón de {{nombre}}">
    {{#valoracion}}<div class="tarjeta-valoracion"><strong>{{valoracion}}</strong><div><span class="estrellas" role="img" aria-label="Valoración en Google"><svg aria-hidden="true"><use href="#i-estrella"></use></svg><svg aria-hidden="true"><use href="#i-estrella"></use></svg><svg aria-hidden="true"><use href="#i-estrella"></use></svg><svg aria-hidden="true"><use href="#i-estrella"></use></svg><svg aria-hidden="true"><use href="#i-estrella"></use></svg></span><small>en Google{{#num_resenas}} · {{num_resenas}} reseñas{{/num_resenas}}</small></div></div>{{/valoracion}}
  </figure>{{/fotos.portada}}
</div></section>
