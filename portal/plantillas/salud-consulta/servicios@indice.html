<section class="kv kv-servicios kv-servicios--indice consulta-variante" id="{{ancla}}"><div class="kv-dentro kv-partida">
  <div class="kv-lado">
    <p class="antetitulo">Tratamientos</p>
    <h2 data-k-titulo-seccion>En qué te podemos ayudar</h2>
    {{#telefono_href}}<p class="acciones"><a class="boton boton--acento" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-calendario"></use></svg>{{telefono}}</a></p>{{/telefono_href}}
  </div>
  <ol class="kv-indice">{{#servicios}}<li><span class="kv-num" aria-hidden="true"></span><div><h3>{{nombre}}</h3>{{#descripcion}}<p>{{descripcion}}</p>{{/descripcion}}</div><span class="icono"><svg aria-hidden="true"><use href="#i-{{#icono}}{{icono}}{{/icono}}{{^icono}}pulso{{/icono}}"></use></svg></span></li>{{/servicios}}</ol>
</div></section>
