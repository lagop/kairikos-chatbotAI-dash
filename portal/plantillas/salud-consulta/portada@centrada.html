<section class="kv kv-portada kv-portada--centrada consulta-variante" id="{{ancla}}">
  <div class="kv-dentro">
    {{#horario_resumen}}<p class="estado">{{horario_resumen}}</p>{{/horario_resumen}}
    <h1 class="kv-titular">{{titular}}</h1>
    {{#subtitulo}}<p class="kv-entradilla">{{subtitulo}}</p>{{/subtitulo}}
    <div class="acciones">
        {{#telefono_href}}<a class="boton boton--acento" href="tel:{{telefono_href}}"><svg aria-hidden="true"><use href="#i-calendario"></use></svg>Pedir cita</a>{{/telefono_href}}
        <a class="boton boton--linea" href="#contacto">Escríbenos</a>
      </div>
    <div class="consulta-abanico"><div class="kv-abanico">
      {{#kv_fotos}}<img src="{{src}}" alt="La consulta de {{nombre}}">{{/kv_fotos}}
      {{^kv_fotos}}<div class="kv-foto-vacia" aria-hidden="true"></div>{{/kv_fotos}}
      </div>
      <svg class="pulso" viewBox="0 0 600 64" aria-hidden="true"><path pathLength="1" d="M2 40H200l14-22 16 40 18-54 16 46 12-18 10 8H598"/></svg>
      {{#telefono_href}}<a class="tarjeta-cita" href="tel:{{telefono_href}}"><span class="icono"><svg aria-hidden="true"><use href="#i-telefono"></use></svg></span><span><strong>Pide tu cita</strong><small>{{telefono}}</small></span></a>{{/telefono_href}}
    </div>
  </div>
</section>
